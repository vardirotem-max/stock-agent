<title>מאזן הבוט</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap">
<style>
/* פריסה: שפת העיצוב של אפל. כותרת גדולה, רשימות מקובצות עם פינות עגולות על רקע אפור-בהיר, צבעי מערכת, גופן מערכת, מרווחים נדיבים, ללא אפקטים. */
:root{
  --bg:#f2f2f7; --card:#ffffff; --fill:#e9e9ee; --sep:rgba(60,60,67,.14);
  --ink:#000000; --ink2:rgba(60,60,67,.6); --ink3:rgba(60,60,67,.3);
  --blue:#007aff; --green:#34c759; --red:#ff3b30; --orange:#ff9500;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display',system-ui,'Heebo','Segoe UI',sans-serif;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1c1c1e; --fill:#2c2c2e; --sep:rgba(84,84,88,.55);
  --ink:#ffffff; --ink2:rgba(235,235,245,.6); --ink3:rgba(235,235,245,.3);
  --blue:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --fill:#2c2c2e; --sep:rgba(84,84,88,.55);
  --ink:#ffffff; --ink2:rgba(235,235,245,.6); --ink3:rgba(235,235,245,.3);
  --blue:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.3;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
bdi,.n{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.g{color:var(--green)}.r{color:var(--red)}.s2{color:var(--ink2)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:start}
button:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:2px;border-radius:10px}
/* title */
.title{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:0 4px}
.title h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.022em;line-height:1.1}
.title small{font-size:13px;color:var(--ink2);padding-bottom:4px;display:flex;align-items:center;gap:6px}
.title small i{width:8px;height:8px;border-radius:50%;background:var(--green)}
.title small.off i{background:var(--red)}
/* summary */
.sum{padding:0 4px}
.sum .lab{font-size:15px;color:var(--ink2)}
.big{font-size:clamp(40px,12.5vw,52px);font-weight:700;letter-spacing:-.035em;line-height:1.05;direction:ltr;text-align:right;font-variant-numeric:tabular-nums;margin-top:2px}
.chg{font-size:17px;font-weight:600;margin-top:4px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.chg .s2{font-weight:400;font-size:15px}
.chartw{margin:18px -4px 0;touch-action:pan-y}
svg.ch{width:100%;height:auto;display:block;overflow:visible}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:9px;padding:2px;margin-top:14px}
.seg button{text-align:center;padding:6px 0;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
/* grouped lists */
.sec h2{margin:0 0 8px;padding:0 16px;font-size:13px;font-weight:400;color:var(--ink2);text-transform:none;display:flex;justify-content:space-between}
.grp{background:var(--card);border-radius:12px;overflow:hidden}
.li{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 16px;min-height:48px;position:relative}
.li+.li::before,.pos+.pos::before{content:"";position:absolute;top:0;inset-inline:16px;border-top:.5px solid var(--sep)}
.li .k{color:var(--ink)}
.li .v{font-weight:600;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.li .v.n2{font-weight:400;color:var(--ink2)}
/* cycle */
.cyc{display:flex;align-items:center;gap:16px;padding:16px}
.cyc svg{width:64px;height:64px;flex:none}
.cyc .tx{min-width:0}
.cyc b{display:block;font-size:17px;font-weight:600}
.cyc span{display:block;font-size:15px;color:var(--ink2);margin-top:2px}
/* positions */
.pos{position:relative}
.pos>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 16px;min-height:60px}
.pos .sy{font-size:17px;font-weight:600}
.pos .tag{font-size:11px;font-weight:600;color:var(--ink2);background:var(--fill);padding:2px 7px;border-radius:6px;margin-inline-start:8px;vertical-align:1px}
.pos .sb{font-size:14px;color:var(--ink2);margin-top:1px}
.pos .rt{display:flex;align-items:center;gap:10px;text-align:left;direction:ltr}
.pos .rt b{display:block;font-size:17px;font-weight:600}
.pos .rt span{display:block;font-size:14px;font-weight:500}
.pos .chev{width:8px;height:13px;stroke:var(--ink3);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.pos.open .chev{transform:rotate(90deg)}
.det{display:none;padding:2px 16px 16px}
.pos.open .det{display:block}
.rail{position:relative;height:6px;border-radius:3px;direction:ltr;margin:20px 2px 10px;background:linear-gradient(90deg,var(--red) var(--e),var(--green) var(--e));opacity:.85}
.rail .nw{position:absolute;top:50%;left:var(--c);width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);background:var(--card);border:2px solid var(--ink);opacity:1}
.rail .tk{position:absolute;top:-3px;bottom:-3px;left:var(--e);width:2px;background:var(--card)}
.lv{display:flex;justify-content:space-between;direction:ltr;font-size:13px;color:var(--ink2)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:16px}
.dgrid small{display:block;font-size:13px;color:var(--ink2)}
.dgrid b{font-weight:600;direction:ltr;unicode-bidi:isolate;display:block;text-align:right}
.empty{padding:16px;color:var(--ink2);font-size:15px}
.ord .li{align-items:flex-start}
.ord .l{font-size:14px;color:var(--ink2);margin-top:2px}
.ord .rt{text-align:left;direction:ltr}
/* bars */
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;direction:ltr;margin:6px 16px 14px}
.bar i{display:block;height:100%;background:var(--blue);width:var(--w);border-radius:3px}
.bar i.o{background:var(--orange)}.bar i.r{background:var(--red)}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;direction:ltr;gap:2px;margin:14px 16px 6px}
.stack i{display:block;height:100%}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:8px}
.note{font-size:13px;color:var(--ink2);padding:8px 16px 0}
.foot{font-size:13px;color:var(--ink2);text-align:center;margin:0}
</style>
<main dir="rtl" lang="he">
 <div class="title"><h1>התיק</h1><small id="live"><i></i><span id="stamp"></span></small></div>

 <section class="sum">
  <div class="lab">שווי החשבון</div>
  <div class="big" id="val"></div>
  <div class="chg" id="chg"></div>
  <div class="chartw" id="chart"></div>
  <div class="seg" id="seg"><button data-m="a" aria-pressed="true">התיק</button><button data-m="s" aria-pressed="false">התיק מול SPY</button></div>
 </section>

 <section class="sec">
  <h2><span>היום</span></h2>
  <div class="grp" id="today"></div>
 </section>

 <section class="sec">
  <h2><span>מחזור יומי של הבוט</span></h2>
  <div class="grp cyc" id="cyc"></div>
 </section>

 <section class="sec">
  <h2><span>פוזיציות</span><span id="ph"></span></h2>
  <div class="grp" id="pos"></div>
 </section>

 <section class="sec">
  <h2><span>הוראות ממתינות</span><span id="oh"></span></h2>
  <div class="grp ord" id="ord"></div>
 </section>

 <section class="sec">
  <h2><span>עסקאות סגורות</span><span id="ch2"></span></h2>
  <div class="grp" id="closed"></div>
 </section>

 <section class="sec">
  <h2><span>חשיפה</span></h2>
  <div class="grp" id="exp"></div>
 </section>

 <section class="sec">
  <h2><span>סיכון</span></h2>
  <div class="grp" id="risk"></div>
 </section>
 <p class="foot">מסחר דמה בלבד. לא ייעוץ השקעות.</p>
</main>
<script>
const D={"updated": "2026-10-21 20:13 UTC", "equity": 99826.35, "cash": 85904.25, "buying_power": 382598.88, "day_pl": 872.8700000000099, "day_pct": 0.8821013672283279, "peak": 100000.0, "paused": false, "dd_limit": 5.0, "positions": [{"symbol": "SPY", "qty": 18.0, "entry": 769.98, "price": 773.51, "pl": 63.54, "plpc": 0.45799999999999996, "core": true, "stop": 708.31}], "pending": [], "history": [{"d": "2026-10-09", "e": 100000.0, "spy": 100000.0}, {"d": "2026-10-10", "e": 100000.0, "spy": null}, {"d": "2026-10-13", "e": 100070.97, "spy": 99928.07}, {"d": "2026-10-14", "e": 100142.03, "spy": 98847.88}, {"d": "2026-10-15", "e": 99034.4, "spy": 99129.17}, {"d": "2026-10-16", "e": 99605.56, "spy": 98032.29}, {"d": "2026-10-17", "e": 98968.14, "spy": null}, {"d": "2026-10-20", "e": 98549.38, "spy": 98777.24}, {"d": "2026-10-21", "e": 98953.48, "spy": 99306.42}], "closed": [{"ticker": "IQV", "status": "timeout", "R": 0.17, "usd": 7.575199999999991, "slip": -0.03078343851007545, "date": "2026-10-09"}, {"ticker": "ROK", "status": "timeout", "R": -0.58, "usd": -28.187999999999978, "slip": -0.013892104653855585, "date": "2026-10-09"}, {"ticker": "NVDA", "status": "timeout", "R": -0.57, "usd": -282.83400000000034, "slip": -0.20756050167814824, "date": "2026-10-12"}, {"ticker": "AMAT", "status": "stopped", "R": -1.0, "usd": -487.7999999999994, "slip": -0.07831954373845015, "date": "2026-10-13"}, {"ticker": "DVA", "status": "timeout", "R": -0.04, "usd": -19.737999999999968, "slip": -0.1430772617213245, "date": "2026-10-12"}, {"ticker": "SJM", "status": "timeout", "R": 0.44, "usd": 218.49079999999984, "slip": -0.17491254372814255, "date": "2026-10-12"}, {"ticker": "MU", "status": "stopped", "R": -0.22, "usd": -106.9375999999999, "slip": -5.415352260778123, "date": "2026-10-14"}, {"ticker": "MPWR", "status": "stopped", "R": -0.7, "usd": -293.7550000000002, "slip": -1.729796926995288, "date": "2026-10-14"}, {"ticker": "AMD", "status": "stopped", "R": -0.19, "usd": -94.69980000000008, "slip": -5.439543113415799, "date": "2026-10-15"}, {"ticker": "DE", "status": "timeout", "R": 0.18, "usd": 88.37279999999998, "slip": -0.23063439835173286, "date": "2026-10-14"}, {"ticker": "XYZ", "status": "timeout", "R": 0.47, "usd": 234.65220000000002, "slip": -0.310037462860089, "date": "2026-10-15"}, {"ticker": "CSCO", "status": "timeout", "R": -0.61, "usd": -304.8780000000002, "slip": 0.0, "date": "2026-10-15"}, {"ticker": "TRGP", "status": "timeout", "R": -0.5, "usd": -247.20000000000027, "slip": -0.21614084016036414, "date": "2026-10-15"}, {"ticker": "HSIC", "status": "timeout", "R": 0.11, "usd": 54.93509999999985, "slip": -0.023100023100018505, "date": "2026-10-15"}, {"ticker": "AME", "status": "timeout", "R": 0.34, "usd": 167.79000000000028, "slip": -0.1264531919233132, "date": "2026-10-15"}, {"ticker": "ADI", "status": "timeout", "R": 0.13, "usd": 63.76500000000009, "slip": -0.13242385628264486, "date": "2026-10-15"}, {"ticker": "LYV", "status": "timeout", "R": -0.03, "usd": -14.968799999999966, "slip": -0.1676203687648067, "date": "2026-10-15"}, {"ticker": "ZBRA", "status": "timeout", "R": 0.3, "usd": 147.6959999999996, "slip": -0.06457688685589998, "date": "2026-10-15"}, {"ticker": "AMD", "status": "timeout", "R": 0.19, "usd": 92.69909999999993, "slip": -0.037966444894423704, "date": "2026-10-15"}, {"ticker": "EW", "status": "timeout", "R": 0.05, "usd": 24.863999999999947, "slip": 0.0, "date": "2026-10-15"}, {"ticker": "CPAY", "status": "timeout", "R": 0.09, "usd": 44.963100000000004, "slip": -0.009925558312660164, "date": "2026-10-15"}, {"ticker": "HSIC", "status": "timeout", "R": 0.04, "usd": 19.993599999999926, "slip": 0.0, "date": "2026-10-15"}, {"ticker": "MSI", "status": "timeout", "R": 0.04, "usd": 19.756799999999984, "slip": -0.021880401724168195, "date": "2026-10-15"}, {"ticker": "SOLV", "status": "timeout", "R": 0.16, "usd": 79.80800000000016, "slip": -0.0228206298493793, "date": "2026-10-15"}]};
const $=id=>document.getElementById(id);
const f=(x,d=2)=>x.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const sg=(x,d=2)=>(x>0?'+':x<0?'−':'')+f(Math.abs(x),d);
const cc=x=>x<0?'r':'g';
const B=t=>`<bdi>${t}</bdi>`;
const TARGET=350,MAXPOS=18;
const hist=D.history.filter(p=>p.e);
const start=hist.length?hist[0].e:D.equity;
const core=D.positions.filter(p=>p.core),bot=D.positions.filter(p=>!p.core);
const corePl=core.reduce((a,p)=>a+p.pl,0),botDay=D.day_pl-corePl;
const unreal=D.positions.reduce((a,p)=>a+p.pl,0),tot=D.equity-start;

$('stamp').textContent=D.paused?'הבוט מושהה':'עודכן '+D.updated.slice(11,16)+' UTC';
$('live').className=D.paused?'off':'';

/* summary + chart */
const pts=hist.map(p=>({d:p.d,e:p.e,spy:p.spy}));pts.push({d:'now',e:D.equity,spy:null});
let mode='a';
const dm=d=>d==='now'?'עכשיו':d.slice(5).split('-').reverse().join('.');
function head(i){
 const p=pts[i],diff=p.e-pts[0].e,pc=pts[0].e?diff/pts[0].e*100:0;
 $('val').textContent='$'+f(p.e);
 $('chg').innerHTML=`<span class="${cc(diff)}">${B(sg(diff)+'$')} ${B('('+sg(pc)+'%)')}</span><span class="s2">${i===pts.length-1?'מתחילת הפעילות':'מתחילת הפעילות · '+dm(p.d)}</span>`}
function chart(){
 const W=560,H=190,T=10,Bt=10,n=pts.length;
 const vs=pts.flatMap(p=>[p.e,mode==='s'?p.spy:null].filter(v=>v!=null));
 let lo=Math.min(...vs),hi=Math.max(...vs);const pad=(hi-lo||300)*.2;lo-=pad;hi+=pad;
 const x=i=>W*(n==1?1:i/(n-1)),y=v=>T+(H-T-Bt)*(1-(v-lo)/(hi-lo));
 const line=k=>pts.map((p,i)=>p[k]==null?null:[x(i),y(p[k])]).filter(Boolean).map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
 const e=[x(n-1),y(pts[n-1].e)],up=pts[n-1].e>=pts[0].e,col=up?'var(--green)':'var(--red)',b=y(pts[0].e);
 let grid='';for(let t=0;t<=3;t++){const yy=T+(H-T-Bt)*t/3;grid+=`<line x1="0" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--sep)" stroke-width=".7"/>`}
 $('chart').innerHTML=`<svg class="ch" id="svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="עקומת שווי החשבון">${grid}
  <line x1="0" x2="${W}" y1="${b}" y2="${b}" stroke="var(--ink3)" stroke-width="1" stroke-dasharray="3 4"/>
  ${mode==='s'?`<path d="${line('spy')}" fill="none" stroke="var(--ink3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`:''}
  <path d="${line('e')}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  <line id="cur" y1="${T}" y2="${H-Bt}" stroke="var(--ink3)" stroke-width="1" opacity="0"/>
  <circle id="dot" cx="${e[0]}" cy="${e[1]}" r="5" fill="${col}" stroke="var(--bg)" stroke-width="2.5"/></svg>`;
 const svg=$('svg');
 const mv=ev=>{const r=svg.getBoundingClientRect();let i=Math.round((ev.clientX-r.left)/r.width*(n-1));i=Math.max(0,Math.min(n-1,i));
  $('dot').setAttribute('cx',x(i));$('dot').setAttribute('cy',y(pts[i].e));$('cur').setAttribute('x1',x(i));$('cur').setAttribute('x2',x(i));$('cur').setAttribute('opacity',1);head(i)};
 const rs=()=>{$('cur').setAttribute('opacity',0);$('dot').setAttribute('cx',e[0]);$('dot').setAttribute('cy',e[1]);head(n-1)};
 ['pointermove','pointerdown'].forEach(t=>svg.addEventListener(t,mv));['pointerleave','pointerup','pointercancel'].forEach(t=>svg.addEventListener(t,rs));
 head(n-1)}
chart();
$('seg').querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;$('seg').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));chart()});

/* today */
const row=(k,v,cls='')=>`<div class="li"><span class="k">${k}</span><span class="v ${cls}">${v}</span></div>`;
$('today').innerHTML=row('רווח או הפסד היום',`<span class="${cc(D.day_pl)}">${sg(D.day_pl)}$ (${sg(D.day_pct)}%)</span>`)+
 row('רווח לא ממומש',`<span class="${cc(unreal)}">${sg(unreal)}$</span>`)+
 row('מזומן','$'+f(D.cash))+row('כוח קנייה','$'+f(D.buying_power),'n2');

/* cycle ring (Apple Fitness style, small) */
(function(){
 const R=26,C=2*Math.PI*R,p=Math.max(0,Math.min(1,botDay/TARGET)),col=botDay>=TARGET?'var(--green)':'var(--blue)';
 $('cyc').innerHTML=`<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${R}" fill="none" stroke="var(--fill)" stroke-width="8"/>
  <circle cx="32" cy="32" r="${R}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 32 32)"/></svg>
  <div class="tx"><b>${B('<span class="'+cc(botDay)+'">'+sg(botDay)+'$</span> מתוך '+TARGET+'$')}</b>
  <span>${botDay>=TARGET?'היעד הושג. הבוט סוגר את הפוזיציות שלו ופותח סיבוב חדש.':'כשמגיעים ליעד הבוט סוגר את הפוזיציות שלו ופותח סיבוב חדש. ליבת SPY לא נספרת.'}</span></div>`})();

/* positions */
const rows=D.positions.slice().sort((a,b)=>b.pl-a.pl);
$('ph').innerHTML=rows.length?B(rows.length+' / '+MAXPOS):'';
function detail(p){
 let rail='';
 if(p.stop&&p.target&&p.target>p.stop){const q=v=>Math.max(0,Math.min(100,(v-p.stop)/(p.target-p.stop)*100));
  rail=`<div class="rail" style="--e:${q(p.entry)}%;--c:${q(p.price)}%"><span class="tk"></span><span class="nw"></span></div><div class="lv"><span>סטופ ${f(p.stop)}</span><span>כניסה ${f(p.entry)}</span><span>יעד ${f(p.target)}</span></div>`}
 else if(p.stop)rail=`<div class="lv" style="margin-top:14px"><span>סטופ ${f(p.stop)}</span><span>כניסה ${f(p.entry)}</span><span>ללא יעד</span></div>`;
 return `${rail}<div class="dgrid"><div><small>רווח או הפסד</small><b class="${cc(p.pl)}">${sg(p.pl)}$</b></div><div><small>שווי</small><b>$${f(p.qty*p.price)}</b></div>
 <div><small>מחיר כניסה</small><b>${f(p.entry)}</b></div><div><small>הפסד בסטופ</small><b>${p.stop?sg((p.stop-p.entry)*p.qty,0)+'$':'—'}</b></div></div>`}
$('pos').innerHTML=rows.length?rows.map(p=>`<div class="pos"><button aria-expanded="false">
  <div><div class="sy">${p.symbol}${p.core?'<span class="tag">ליבה</span>':''}</div><div class="sb">${B(f(p.qty,0)+' מניות')}</div></div>
  <div class="rt"><div><b>${f(p.price)}</b><span class="${cc(p.pl)}">${sg(p.plpc,2)}%</span></div><svg class="chev" viewBox="0 0 8 13"><path d="M1.5 1.5l5 5-5 5" /></svg></div></button>
  <div class="det">${detail(p)}</div></div>`).join(''):'<div class="empty">אין פוזיציות פתוחות. ההוראות הממתינות מחכות למילוי.</div>';
document.querySelectorAll('.pos>button').forEach(b=>b.onclick=()=>{const el=b.parentElement,o=el.classList.toggle('open');b.setAttribute('aria-expanded',o)});

/* orders */
$('oh').textContent=D.pending.length?D.pending.length+' ממתינות':'';
$('ord').innerHTML=D.pending.length?D.pending.map(o=>`<div class="li"><div><div style="font-weight:600">${o.symbol}</div><div class="l">${B(o.qty+' מניות')} · קנייה בלימיט</div></div>
 <div class="rt"><div class="v" style="font-weight:600">${f(o.limit)}</div><div class="l">סטופ ${o.stop?f(o.stop):'—'} · יעד ${o.target?f(o.target):'—'}</div></div></div>`).join(''):'<div class="empty">אין הוראות ממתינות. הסיבוב הבא נפתח עם פתיחת המסחר.</div>';

/* closed trades */
(function(){
 const c=(D.closed||[]).slice().reverse();
 if(!c.length){$('closed').innerHTML='<div class="empty">אין עדיין עסקאות סגורות.</div>';return}
 const n=c.length,w=c.filter(t=>t.R>0).length,usd=c.reduce((a,t)=>a+t.usd,0);
 $('ch2').innerHTML=B(n+' אחרונות');
 const names={target:'יעד',stopped:'סטופ',timeout:'נסגרה'};
 $('closed').innerHTML=row('הצלחה',`${f(w/n*100,0)}%`)+row('סה"כ מהעסקאות האלה',`<span class="${cc(usd)}">${sg(usd,0)}$</span>`)+
  c.slice(0,10).map(t=>`<div class="li"><div><div style="font-weight:600">${t.ticker}</div><div class="l s2" style="font-size:14px">${names[t.status]||t.status}</div></div><div class="v ${cc(t.usd)}">${sg(t.usd,0)}$ <span class="s2" style="font-weight:400">${sg(t.R,2)}R</span></div></div>`).join('');
})();

/* exposure */
const val=a=>a.reduce((s,p)=>s+p.qty*p.price,0);
const vb=val(bot),vc=val(core),cash=D.cash,tt=vb+vc+cash||1;
const part=(c,v)=>v/tt>.004?`<i style="width:${v/tt*100}%;background:${c}"></i>`:'';
$('exp').innerHTML=`<div class="stack">${part('var(--blue)',vb)}${part('var(--orange)',vc)}${part('var(--ink3)',cash)}</div>`+
 [['var(--blue)','פוזיציות הבוט',vb],['var(--orange)','ליבת SPY',vc],['var(--ink3)','מזומן',cash]].map(([c,l,v])=>`<div class="li"><span class="k"><span class="dot" style="background:${c}"></span>${l}</span><span class="v">$${f(v,0)} <span class="s2" style="font-weight:400">${f(v/tt*100,0)}%</span></span></div>`).join('');

/* risk */
const dd=D.peak?Math.max(0,(D.peak-D.equity)/D.peak*100):0,lim=D.dd_limit||5,k=dd/lim;
const pend=D.pending.reduce((a,o)=>a+(+o.qty)*o.limit,0);
$('risk').innerHTML=row('ירידה מהשיא',`<span class="${k>.6?'r':''}">${f(dd,2)}%</span>`)+
 `<div class="bar"><i class="${k>.8?'r':k>.5?'o':''}" style="--w:${Math.min(100,k*100)}%"></i></div>`+
 `<div class="note" style="padding-top:0;padding-bottom:12px">הבוט נעצר אוטומטית ב־${B(f(lim,0)+'%')} ירידה מהשיא (${B('$'+f(D.peak,0))}).</div>`+
 row('מההתחלה',`<span class="${cc(tot)}">${sg(tot)}$</span>`)+row('הוראות שממתינות לביצוע','$'+f(pend,0),'n2');
</script>

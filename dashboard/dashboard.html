<title>מאזן הבוט</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Heebo:wght@400;500;700&display=swap">
<style>
/* פריסה: אפליקציית מסחר לנייד. ערך תיק גדול וגרף ירוק/אדום עם סקראב, כרטיס כוח קנייה, רשימת פוזיציות עם כדורי אחוז, מגירה לכל פוזיציה, סרגל ניווט תחתון. */
:root{
  --bg:#0a0c0f; --card:#13161b; --card2:#1a1e25; --line:#242932; --ink:#f4f6f9; --mute:#8d96a5; --faint:#5d6674;
  --up:#1fd66b; --down:#ff5b3a; --pl:var(--up); --on-pl:#04170b; --spy:#8d96a5; --nav:rgba(10,12,15,.88);
  --sans:'Manrope','Heebo',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#ffffff; --card:#f3f5f8; --card2:#e9edf2; --line:#e1e6ed; --ink:#0b0d10; --mute:#5f6a79; --faint:#98a2b0;
  --up:#00a548; --down:#e5361b; --on-pl:#ffffff; --spy:#8590a0; --nav:rgba(255,255,255,.9); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#ffffff; --card:#f3f5f8; --card2:#e9edf2; --line:#e1e6ed; --ink:#0b0d10; --mute:#5f6a79; --faint:#98a2b0;
  --up:#00a548; --down:#e5361b; --on-pl:#ffffff; --spy:#8590a0; --nav:rgba(255,255,255,.9); color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;
  padding-block:14px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
bdi,.n{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--pl);outline-offset:3px;border-radius:8px}
h2{font-size:1.2rem;font-weight:800;letter-spacing:-.02em;margin:0}
/* top */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h1{margin:0;font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;background:var(--card);font-size:.76rem;color:var(--mute)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--up)}
.pill.off i{background:var(--down)}
/* hero */
.hero .lab{font-size:.9rem;color:var(--mute);font-weight:600}
.val{font-size:clamp(2.5rem,13vw,3.5rem);font-weight:800;letter-spacing:-.045em;line-height:1.05;direction:ltr;text-align:right;font-variant-numeric:tabular-nums;margin-top:2px}
.chg{display:flex;align-items:center;justify-content:flex-start;gap:8px;margin-top:4px;font-weight:700;font-size:.95rem;color:var(--pl)}
.chg svg{width:11px;height:11px;flex:none}
.chg .w{color:var(--mute);font-weight:500}
.chart{margin:14px -2px 0;touch-action:pan-y;user-select:none;-webkit-user-select:none}
svg.ch{width:100%;height:auto;display:block;overflow:visible}
.rng{display:flex;justify-content:space-between;gap:6px;margin-top:8px}
.rng button{flex:1;padding:8px 0;border-radius:99px;font-weight:700;font-size:.82rem;color:var(--pl)}
.rng button[aria-pressed="true"]{background:var(--pl);color:var(--on-pl)}
/* cards */
.card{background:var(--card);border-radius:20px;padding:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.bp{font-weight:700}
.bp b{font-weight:800;direction:ltr;unicode-bidi:isolate;display:inline-block}
.cyc .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cyc .t b{font-weight:800}
.cyc .amt{font-weight:800;font-size:1.4rem;letter-spacing:-.03em}
.track{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;direction:ltr;margin-top:12px}
.track i{display:block;height:100%;border-radius:99px;background:var(--up);width:var(--w)}
.cyc .s{display:flex;justify-content:space-between;direction:ltr;font-size:.74rem;color:var(--mute);margin-top:7px}
.note{font-size:.8rem;color:var(--mute);margin-top:10px}
/* lists */
.sec .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.sec .hd span{font-size:.82rem;color:var(--mute)}
.pos{border-bottom:1px solid var(--line)}
.pos:last-child{border-bottom:0}
.pos>button{width:100%;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:14px;padding:14px 0;text-align:start}
.sym{font-weight:800;font-size:1.05rem;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
.tag{font-size:.64rem;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--mute)}
.sub{font-size:.78rem;color:var(--mute)}
.mini{width:62px;height:30px}
.px{text-align:left;direction:ltr}
.px b{display:block;font-weight:700;font-size:.98rem}
.chip{display:inline-block;min-width:68px;text-align:center;padding:6px 8px;border-radius:8px;font-weight:700;font-size:.84rem;color:var(--on-pl);background:var(--up);direction:ltr;unicode-bidi:isolate}
.chip.d{background:var(--down)}
.det{display:none;padding:0 0 16px}
.pos.open .det{display:block}
.rail{position:relative;height:6px;border-radius:99px;direction:ltr;margin:18px 4px 10px;background:linear-gradient(90deg,var(--down) var(--e),var(--up) var(--e));opacity:.9}
.rail .nw{position:absolute;top:50%;left:var(--c);width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);background:var(--ink);border:3px solid var(--bg)}
.rail .tk{position:absolute;top:-4px;bottom:-4px;left:var(--e);width:2px;background:var(--bg)}
.lv{display:flex;justify-content:space-between;direction:ltr;font-size:.74rem;color:var(--mute)}
.lv span:nth-child(1){color:var(--down)}.lv span:nth-child(3){color:var(--up)}.lv span:nth-child(2){color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:14px}
.grid small{display:block;color:var(--mute);font-size:.74rem}
.grid b{font-weight:700;direction:ltr;display:block;text-align:right}
.empty{color:var(--mute);padding:14px 0}
.ordr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.ordr:last-child{border-bottom:0}
.ordr .r{text-align:left;direction:ltr}
.ordr .r b{display:block;font-weight:700}
/* stats */
.st{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:20px;overflow:hidden}
.st div{background:var(--card);padding:14px 16px;min-width:0}
.st small{display:block;color:var(--mute);font-size:.76rem}
.st b{font-size:1.15rem;font-weight:800;letter-spacing:-.02em;direction:ltr;unicode-bidi:isolate;display:block;text-align:right;margin-top:2px}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;direction:ltr;gap:2px;margin-top:12px}
.stack i{display:block;height:100%}
.keys{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:.78rem;color:var(--mute)}
.keys em{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px;font-style:normal}
.foot{font-size:.72rem;color:var(--faint);text-align:center;margin:0}
/* nav */
nav{position:fixed;inset:auto 0 0 0;background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));z-index:5}
nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:.68rem;font-weight:700;color:var(--faint)}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="true"]{color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.track i{animation:g .9s cubic-bezier(.2,.7,.2,1) backwards}@keyframes g{from{width:0}}}
</style>
<main dir="rtl" lang="he">
 <div class="top"><h1>חשבון דמה</h1><span class="pill" id="st"><i></i><span id="stamp"></span></span></div>

 <section class="hero" id="home">
  <div class="lab">שווי התיק</div>
  <div class="val" id="val"></div>
  <div class="chg" id="chg"></div>
  <div class="chart"><div id="chart"></div></div>
  <div class="rng" id="rng"></div>
 </section>

 <div class="card row bp" id="bp"></div>
 <div class="card cyc" id="cyc"></div>

 <section class="sec" id="positions">
  <div class="hd"><h2>פוזיציות</h2><span id="ph"></span></div>
  <div id="pos"></div>
 </section>

 <section class="sec" id="orders">
  <div class="hd"><h2>הוראות ממתינות</h2><span id="oh"></span></div>
  <div id="ord"></div>
 </section>

 <section class="sec" id="risk">
  <div class="hd"><h2>סיכון וחשיפה</h2><span id="posn"></span></div>
  <div class="card">
   <div class="stack" id="stack"></div><div class="keys" id="keys"></div>
  </div>
  <div class="st" id="kv" style="margin-top:12px"></div>
  <div class="card cyc" id="dd" style="margin-top:12px"></div>
 </section>
 <p class="foot">מסחר דמה בלבד. לא ייעוץ השקעות.</p>
</main>
<nav aria-label="ניווט"><div id="nav"></div></nav>
<script>
const D={"updated": "2026-10-15 19:38 UTC", "equity": 99466.68, "cash": 31181.42, "buying_power": 298102.96, "day_pl": 432.27999999999884, "day_pct": 0.43649479372823874, "peak": 100000.0, "paused": false, "dd_limit": 5.0, "positions": [{"symbol": "CSCO", "qty": 112.0, "entry": 109.73, "price": 109.4, "pl": -36.96, "plpc": -0.301, "core": false, "stop": 105.3, "target": 111.97}, {"symbol": "J", "qty": 99.0, "entry": 140.94, "price": 141.2, "pl": 25.74, "plpc": 0.184, "core": false, "stop": 135.9, "target": 143.48}, {"symbol": "LYV", "qty": 88.0, "entry": 172.42, "price": 172.915, "pl": 43.56, "plpc": 0.28700000000000003, "core": false, "stop": 166.82, "target": 175.3}, {"symbol": "SPY", "qty": 18.0, "entry": 769.98, "price": 772.32, "pl": 42.12, "plpc": 0.304, "core": true, "stop": 708.31}, {"symbol": "TRGP", "qty": 46.0, "entry": 281.44, "price": 281.2, "pl": -11.04, "plpc": -0.08499999999999999, "core": false, "stop": 270.62, "target": 286.88}], "pending": [{"symbol": "AME", "qty": "72", "limit": 247.52, "stop": 240.64, "target": 250.99}], "history": [{"d": "2026-10-09", "e": 100000.0, "spy": 100000.0}, {"d": "2026-10-10", "e": 100000.0, "spy": null}, {"d": "2026-10-13", "e": 100070.97, "spy": 99928.07}, {"d": "2026-10-14", "e": 100142.03, "spy": 98847.88}, {"d": "2026-10-15", "e": 99034.4, "spy": 99197.25}]};
const $=id=>document.getElementById(id);
const f=(x,d=2)=>x.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const sg=(x,d=2)=>(x>0?'+':x<0?'−':'')+f(Math.abs(x),d);
const cs=x=>x<0?'down':'up';
const B=t=>`<bdi>${t}</bdi>`;
const TARGET=350,MAXPOS=18;
const tri=u=>u?'<svg viewBox="0 0 12 12"><path d="M6 1l5.5 9.5h-11z" fill="currentColor"/></svg>':'<svg viewBox="0 0 12 12"><path d="M6 11L.5 1.5h11z" fill="currentColor"/></svg>';
const hist=D.history.filter(p=>p.e);
const start=hist.length?hist[0].e:D.equity;
const core=D.positions.filter(p=>p.core),bot=D.positions.filter(p=>!p.core);
const corePl=core.reduce((a,p)=>a+p.pl,0),botDay=D.day_pl-corePl;
const root=document.documentElement;
const win=D.equity>=start;
root.style.setProperty('--pl',win?'var(--up)':'var(--down)');
root.style.setProperty('--on-pl',win?'var(--on-pl)':'#fff');

$('stamp').textContent='עודכן '+D.updated.slice(11,16)+'Z';
$('st').className='pill'+(D.paused?' off':'');
if(D.paused)$('stamp').textContent='מושהה';

// series: history points + live point
const pts=hist.map(p=>({d:p.d,e:p.e,spy:p.spy}));
pts.push({d:'עכשיו',e:D.equity,spy:null,live:true});
let mode='all';
function setHead(i){
  const p=pts[i],base=pts[0].e,diff=p.e-base,pc=base?diff/base*100:0;
  const ref=i==pts.length-1?D.day_pl:p.e-(pts[Math.max(0,i-1)].e);
  $('val').textContent='$'+f(p.e);
  const label=i==pts.length-1?'מההתחלה':'מההתחלה · '+p.d.slice(5).split('-').reverse().join('.');
  $('chg').innerHTML=`${tri(diff>=0)}<span>${B(f(Math.abs(diff))+'$')} ${B('('+f(Math.abs(pc))+'%)')}</span><span class="w">${label}</span>`;
}
function draw(){
  const W=560,H=190,L=0,R=0,T=10,Bt=6,n=pts.length;
  const vs=pts.flatMap(p=>[p.e,mode=='spy'?p.spy:null].filter(v=>v!=null));
  let lo=Math.min(...vs),hi=Math.max(...vs);const pad=(hi-lo||300)*.18;lo-=pad;hi+=pad;
  const x=i=>L+(W-L-R)*(n==1?1:i/(n-1)),y=v=>T+(H-T-Bt)*(1-(v-lo)/(hi-lo));
  const line=k=>pts.map((p,i)=>p[k]==null?null:[x(i),y(p[k])]).filter(Boolean).map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const e=[x(n-1),y(pts[n-1].e)],b=y(pts[0].e);
  $('chart').innerHTML=`<svg class="ch" id="svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="עקומת שווי התיק">
   <line x1="0" x2="${W}" y1="${b}" y2="${b}" stroke="var(--faint)" stroke-width="1.2" stroke-dasharray="2 6" opacity=".7"/>
   ${mode=='spy'?`<path d="${line('spy')}" fill="none" stroke="var(--spy)" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round"/>`:''}
   <path d="${line('e')}" fill="none" stroke="var(--pl)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
   <line id="cur" y1="${T}" y2="${H}" stroke="var(--mute)" stroke-width="1" opacity="0"/>
   <circle id="halo" cx="${e[0]}" cy="${e[1]}" r="11" fill="var(--pl)" opacity=".18"/>
   <circle id="dot" cx="${e[0]}" cy="${e[1]}" r="5" fill="var(--pl)" stroke="var(--bg)" stroke-width="2.5"/></svg>`;
  const svg=$('svg');
  const mv=ev=>{const r=svg.getBoundingClientRect(),px=(ev.clientX-r.left)/r.width*W;let i=Math.round(px/W*(n-1));i=Math.max(0,Math.min(n-1,i));
    $('dot').setAttribute('cx',x(i));$('dot').setAttribute('cy',y(pts[i].e));$('halo').setAttribute('cx',x(i));$('halo').setAttribute('cy',y(pts[i].e));
    const c=$('cur');c.setAttribute('x1',x(i));c.setAttribute('x2',x(i));c.setAttribute('opacity',1);setHead(i)};
  const rs=()=>{$('cur').setAttribute('opacity',0);$('dot').setAttribute('cx',e[0]);$('dot').setAttribute('cy',e[1]);$('halo').setAttribute('cx',e[0]);$('halo').setAttribute('cy',e[1]);setHead(n-1)};
  svg.addEventListener('pointermove',mv);svg.addEventListener('pointerdown',mv);svg.addEventListener('pointerleave',rs);svg.addEventListener('pointerup',rs);svg.addEventListener('pointercancel',rs);
}
setHead(pts.length-1);draw();
$('rng').innerHTML=[['all','הכל'],['spy','מול SPY']].map(([k,l])=>`<button data-m="${k}" aria-pressed="${k==mode}">${l}</button>`).join('')+
  `<button disabled style="opacity:.0;pointer-events:none"></button>`;
$('rng').querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;$('rng').querySelectorAll('button[data-m]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.m==mode));draw();setHead(pts.length-1)});

// buying power + cycle
$('bp').innerHTML=`<span>כוח קנייה</span><b>$${f(D.buying_power)}</b>`;
const pc=Math.max(0,Math.min(100,botDay/TARGET*100));
$('cyc').innerHTML=`<div class="t"><b>מחזור יומי של הבוט</b><span class="amt ${cs(botDay)}">${B(sg(botDay)+'$')}</span></div>
 <div class="track"><i style="--w:${botDay<0?0:pc}%;${botDay>=TARGET?'':''}"></i></div>
 <div class="s"><span>0</span><span>${TARGET}$ יעד</span></div>
 <div class="note">${botDay>=TARGET?'היעד הושג. הבוט סוגר את הפוזיציות שלו ופותח סיבוב חדש.':'ברגע שהבוט מגיע ליעד הוא סוגר את הפוזיציות שלו ופותח סיבוב חדש. ליבת SPY לא נספרת.'}</div>`;

// positions
function rail(p){
  if(!(p.stop&&p.target&&p.target>p.stop))return p.stop?`<div class="lv" style="margin-top:14px"><span>סטופ ${f(p.stop)}</span><span>כניסה ${f(p.entry)}</span><span>ללא יעד</span></div>`:'';
  const q=v=>Math.max(0,Math.min(100,(v-p.stop)/(p.target-p.stop)*100));
  return `<div class="rail" style="--e:${q(p.entry)}%;--c:${q(p.price)}%"><span class="tk"></span><span class="nw"></span></div>
   <div class="lv"><span>סטופ ${f(p.stop)}</span><span>כניסה ${f(p.entry)}</span><span>יעד ${f(p.target)}</span></div>`}
function mini(p){
  const u=p.pl>=0,c=u?'var(--up)':'var(--down)';
  if(p.stop&&p.target&&p.target>p.stop){
    const q=v=>Math.max(0,Math.min(1,(v-p.stop)/(p.target-p.stop)));
    const e=q(p.entry)*54+4,n=q(p.price)*54+4;
    return `<svg class="mini" viewBox="0 0 62 30" aria-hidden="true"><line x1="4" x2="58" y1="15" y2="15" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/><line x1="${Math.min(e,n)}" x2="${Math.max(e,n)}" y1="15" y2="15" stroke="${c}" stroke-width="3" stroke-linecap="round"/><line x1="${e}" x2="${e}" y1="9" y2="21" stroke="var(--mute)" stroke-width="1.5"/><circle cx="${n}" cy="15" r="4" fill="${c}"/></svg>`}
  return '<svg class="mini" viewBox="0 0 62 30" aria-hidden="true"></svg>'}
const rows=D.positions.slice().sort((a,b)=>b.pl-a.pl);
$('ph').textContent=rows.length?rows.length+' פתוחות':'';
$('pos').innerHTML=rows.length?rows.map((p,i)=>`<div class="pos" id="p${i}"><button aria-expanded="false" data-i="${i}">
  <div><div class="sym">${p.symbol}${p.core?'<span class="tag">ליבה</span>':''}</div><div class="sub">${B(f(p.qty,0)+' מניות')}</div></div>
  ${mini(p)}
  <div class="px"><b>${f(p.price)}</b><span class="chip ${p.pl<0?'d':''}">${sg(p.plpc,2)}%</span></div></button>
  <div class="det">${rail(p)}
   <div class="grid"><div><small>רווח/הפסד</small><b class="${cs(p.pl)}">${sg(p.pl)}$</b></div><div><small>שווי</small><b>$${f(p.qty*p.price)}</b></div>
   <div><small>מחיר כניסה</small><b>${f(p.entry)}</b></div><div><small>סיכון בסטופ</small><b>${p.stop?sg((p.stop-p.entry)*p.qty,0)+'$':'—'}</b></div></div></div></div>`).join(''):'<div class="empty">אין פוזיציות פתוחות. ההוראות הממתינות מחכות למילוי.</div>';
document.querySelectorAll('.pos>button').forEach(b=>b.onclick=()=>{const el=b.parentElement,o=el.classList.toggle('open');b.setAttribute('aria-expanded',o)});

// orders
$('oh').textContent=D.pending.length?D.pending.length+' ממתינות':'';
$('ord').innerHTML=D.pending.length?D.pending.map(o=>`<div class="ordr"><div><div class="sym">${o.symbol}</div><div class="sub">${B(o.qty+' מניות')} · קנייה בלימיט</div></div>
 <div class="r"><b>${f(o.limit)}</b><span class="sub">סטופ ${o.stop?f(o.stop):'—'} · יעד ${o.target?f(o.target):'—'}</span></div></div>`).join(''):'<div class="empty">אין הוראות ממתינות. הסיבוב הבא נפתח עם פתיחת המסחר.</div>';

// risk
const val=a=>a.reduce((s,p)=>s+p.qty*p.price,0);
const vb=val(bot),vc=val(core),cash=D.cash,tt=vb+vc+cash||1;
const sg2=(c,v)=>v/tt>.004?`<i style="width:${v/tt*100}%;background:${c}"></i>`:'';
$('stack').innerHTML=sg2("var(--up)",vb)+sg2('var(--spy)',vc)+sg2('var(--card2)',cash);
$('keys').innerHTML=`<span><em style="background:var(--up)"></em>הבוט ${B('$'+f(vb,0))}</span><span><em style="background:var(--spy)"></em>ליבת SPY ${B('$'+f(vc,0))}</span><span><em style="background:var(--card2);border:1px solid var(--line)"></em>מזומן ${B('$'+f(cash,0))}</span>`;
$('posn').innerHTML=B(D.positions.length+' / '+MAXPOS);
const unreal=D.positions.reduce((a,p)=>a+p.pl,0),pend=D.pending.reduce((a,o)=>a+(+o.qty)*o.limit,0),tot=D.equity-start;
$('kv').innerHTML=[['רווח היום',`<span class="${cs(D.day_pl)}">${sg(D.day_pl)}$</span>`],['מההתחלה',`<span class="${cs(tot)}">${sg(tot,0)}$</span>`],
 ['רווח לא ממומש',`<span class="${cs(unreal)}">${sg(unreal)}$</span>`],['ממתין לביצוע','$'+f(pend,0)]].map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join('');
const dd=D.peak?Math.max(0,(D.peak-D.equity)/D.peak*100):0,lim=D.dd_limit||5;
$('dd').innerHTML=`<div class="t"><b>ירידה מהשיא</b><span class="amt ${dd/lim>.6?'down':''}">${B(f(dd,2)+'%')}</span></div>
 <div class="track"><i style="--w:${Math.min(100,dd/lim*100)}%;background:${dd/lim>.6?'var(--down)':'var(--up)'}"></i></div>
 <div class="s"><span>0</span><span>${f(lim,0)}% עצירה אוטומטית</span></div>`;

// nav
const ic={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',pos:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',ord:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',risk:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>'};
const items=[['home','בית','home'],['pos','פוזיציות','positions'],['ord','הוראות','orders'],['risk','סיכון','risk']];
$('nav').innerHTML=items.map(([k,l,id],i)=>`<button data-t="${id}" ${i==0?'aria-current="true"':''}><svg viewBox="0 0 24 24">${ic[k]}</svg>${l}</button>`).join('');
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','true');
  const t=$(b.dataset.t);const y=b.dataset.t=='home'?0:t.getBoundingClientRect().top+window.scrollY-14;window.scrollTo({top:y,behavior:'smooth'})});
</script>

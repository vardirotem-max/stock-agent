<title>מאזן הבוט</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Heebo:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* פריסה: כרזה בכחול אולטרמרין. מספר שווי ענק, פס מחזור 350$, מדפי "סולמות מחיר" לכל פוזיציה (סטופ למטה, יעד למעלה), עקומה מול SPY. */
:root{
  --bg:#0a1a5c; --bg2:#0e2273; --panel:#112a86; --line:rgba(255,255,255,.16); --line2:rgba(255,255,255,.08);
  --ink:#f2f5ff; --mute:#a9b7ea; --faint:#7384c4;
  --sig:#ffd23f; --good:#4ff0b0; --bad:#ff7a63; --spy:#b9c6f5;
  --zg:rgba(79,240,176,.20); --zb:rgba(255,122,99,.22);
  --disp:'Bricolage Grotesque','Heebo',system-ui,sans-serif; --sans:'Heebo',system-ui,-apple-system,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#e9eefb; --bg2:#dde5f7; --panel:#ffffff; --line:rgba(10,26,92,.20); --line2:rgba(10,26,92,.09);
  --ink:#0a1a5c; --mute:#40508f; --faint:#6b79ad;
  --sig:#c98a00; --good:#00835a; --bad:#cc3b25; --spy:#6a79b3;
  --zg:rgba(0,131,90,.14); --zb:rgba(204,59,37,.14); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#e9eefb; --bg2:#dde5f7; --panel:#ffffff; --line:rgba(10,26,92,.20); --line2:rgba(10,26,92,.09);
  --ink:#0a1a5c; --mute:#40508f; --faint:#6b79ad;
  --sig:#c98a00; --good:#00835a; --bad:#cc3b25; --spy:#6a79b3;
  --zg:rgba(0,131,90,.14); --zb:rgba(204,59,37,.14); color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding-block:20px 44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
main{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:30px}
bdi,.n{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.good{color:var(--good)}.bad{color:var(--bad)}
h2{font-family:var(--disp);font-weight:700;font-size:1.05rem;letter-spacing:-.01em;margin:0}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.hd span{font-size:.78rem;color:var(--mute)}
/* top */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.82rem;color:var(--mute)}
.top b{font-family:var(--disp);font-weight:800;color:var(--ink);font-size:1rem;letter-spacing:-.01em}
.st{display:inline-flex;align-items:center;gap:7px}
.st i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.st.off i{background:var(--bad)}
/* hero */
.hero{display:flex;flex-direction:column;gap:14px}
.lab{font-size:.82rem;color:var(--mute)}
.big{font-family:var(--disp);font-weight:800;font-size:clamp(3rem,17vw,5.6rem);line-height:.92;letter-spacing:-.055em;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.big sup{font-size:.34em;vertical-align:.95em;margin-inline-end:.12em;color:var(--sig);font-weight:700;letter-spacing:0}
.big small{font-size:.38em;color:var(--mute);letter-spacing:-.02em}
.row{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline}
.dl{font-family:var(--disp);font-weight:700;font-size:1.25rem;letter-spacing:-.02em}
.sub{font-size:.85rem;color:var(--mute)}
/* cycle */
.cyc{padding-top:6px}
.cyc .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:9px;font-size:.85rem}
.cyc .t b{font-family:var(--disp);font-weight:700;font-size:1rem}
.bar{position:relative;height:26px;border:1.5px solid var(--ink);direction:ltr;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),var(--line2) calc(10% - 1px) 10%)}
.bar .f{position:absolute;inset:0 auto 0 0;background:var(--sig);width:var(--w)}
.bar .f.neg{background:var(--bad)}
.bar .m{position:absolute;top:-6px;bottom:-6px;width:0;border-left:2px solid var(--ink)}
.scale{display:flex;justify-content:space-between;direction:ltr;font-family:var(--mono);font-size:.7rem;color:var(--mute);margin-top:6px}
/* ladders */
.rack{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;margin-inline:-2px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.lad{flex:0 0 122px;scroll-snap-align:start;background:var(--bg2);border:1px solid var(--line);padding:11px 10px 10px;display:flex;flex-direction:column;gap:8px}
.lad .sy{font-family:var(--disp);font-weight:800;font-size:1.15rem;letter-spacing:-.03em;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.lad .sy em{font-style:normal;font-family:var(--sans);font-weight:500;font-size:.66rem;color:var(--bg);background:var(--sig);padding:1px 6px}
.lad .qt{font-size:.72rem;color:var(--mute)}
.lad .pl{font-family:var(--disp);font-weight:700;font-size:1.02rem;letter-spacing:-.02em;direction:ltr;text-align:right}
.lad .pl small{display:block;font-family:var(--mono);font-weight:400;font-size:.68rem;opacity:.9}
.tr{position:relative;height:170px;direction:ltr;margin:2px 0 2px}
.tr .ax{position:absolute;left:52px;top:0;bottom:0;width:0;border-left:1.5px solid var(--ink);opacity:.85}
.tr .zg,.tr .zb{position:absolute;left:52px;width:16px}
.tr .zg{background:var(--zg)}.tr .zb{background:var(--zb)}
.tr .lv{position:absolute;left:0;right:0;font-family:var(--mono);font-size:.66rem;color:var(--mute);height:0;display:flex;align-items:center}
.tr .lv b{width:46px;text-align:right;font-weight:400}
.tr .lv s{display:block;width:12px;border-top:1.5px solid currentColor;margin-left:6px;text-decoration:none}
.tr .lv.t{color:var(--good)}.tr .lv.s{color:var(--bad)}.tr .lv.e{color:var(--ink)}
.tr .nw{position:absolute;left:52px;width:0;height:0}
.tr .nw::before{content:"";position:absolute;left:-7px;top:-7px;width:14px;height:14px;background:var(--sig);border:2px solid var(--bg2);border-radius:50%;box-shadow:0 0 0 1.5px var(--ink)}
.tr .nw span{position:absolute;left:14px;top:-9px;font-family:var(--mono);font-size:.72rem;font-weight:500;color:var(--ink);white-space:nowrap}
.tr .open{position:absolute;left:52px;top:0;width:16px;height:26px;background:linear-gradient(var(--bg2),transparent);}
.hint{font-size:.72rem;color:var(--faint)}
/* exposure */
.stack{display:flex;height:34px;direction:ltr;border:1.5px solid var(--ink)}
.stack div{height:100%;min-width:0;display:flex;align-items:center;padding-inline:8px;font-family:var(--mono);font-size:.68rem;overflow:hidden;white-space:nowrap}
.s1{background:var(--sig);color:#0a1a5c}.s2{background:var(--spy);color:#0a1a5c}.s3{background:transparent;color:var(--mute)}
.keys{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:.78rem;color:var(--mute)}
.keys i{display:inline-block;width:10px;height:10px;margin-inline-end:6px;vertical-align:-1px;border:1px solid var(--ink)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:18px;border-top:1px solid var(--line)}
.kv div{padding:11px 0;border-bottom:1px solid var(--line2);min-width:0}
.kv div:nth-child(odd){padding-inline-end:12px}
.kv small{display:block;font-size:.74rem;color:var(--mute)}
.kv b{font-family:var(--disp);font-weight:700;font-size:1.15rem;letter-spacing:-.02em;direction:ltr;display:block;text-align:right}
.dd{margin-top:16px}
.dd .t{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:7px}
.dd .bar{height:14px}
/* chart */
svg.ch{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:18px;font-size:.78rem;color:var(--mute);margin-top:10px}
.legend i{display:inline-block;width:18px;margin-inline-end:7px;vertical-align:3px}
/* pending */
.pd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2)}
.pd:first-child{padding-top:0}
.pd b{font-family:var(--disp);font-weight:800;font-size:1.05rem;letter-spacing:-.02em}
.pd .a{font-size:.78rem;color:var(--mute)}
.pd .r{text-align:right;direction:ltr;font-family:var(--mono);font-size:.82rem}
.pd .r small{display:block;color:var(--mute);font-size:.7rem}
.empty{color:var(--mute);font-size:.88rem}
.foot{font-size:.72rem;color:var(--faint);text-align:center}
@media (prefers-reduced-motion:no-preference){.bar .f{animation:grow 1s cubic-bezier(.2,.7,.2,1) backwards}@keyframes grow{from{width:0}}}
</style>
<main dir="rtl" lang="he">
 <div class="top"><b>חשבון דמה · Alpaca</b><span class="st" id="st"><i></i><span id="stamp"></span></span></div>

 <section class="hero">
  <div class="lab">שווי החשבון</div>
  <div class="big" id="eq"></div>
  <div class="row" id="delta"></div>
  <div class="cyc" id="cyc"></div>
 </section>

 <section>
  <div class="hd"><h2>סולמות מחיר</h2><span id="ph"></span></div>
  <div class="rack" id="rack"></div>
  <div class="hint">כל סולם: סטופ למטה, יעד למעלה, העיגול הוא המחיר עכשיו. מגלגלים הצידה לעוד פוזיציות.</div>
 </section>

 <section>
  <div class="hd"><h2>איפה הכסף</h2><span id="posn"></span></div>
  <div class="stack" id="stack"></div>
  <div class="keys" id="keys"></div>
  <div class="kv" id="kv"></div>
  <div class="dd" id="dd"></div>
 </section>

 <section>
  <div class="hd"><h2>הבוט מול SPY</h2><span id="since"></span></div>
  <div id="chart"></div>
  <div class="legend"><span><i style="border-top:3px solid var(--sig)"></i>הבוט</span><span><i style="border-top:2px dashed var(--spy)"></i>SPY, אותו סכום התחלתי</span></div>
 </section>

 <section>
  <div class="hd"><h2>הוראות קנייה ממתינות</h2><span id="oh"></span></div>
  <div id="ord"></div>
 </section>
 <p class="foot">מסחר דמה בלבד. לא ייעוץ השקעות.</p>
</main>
<script>
const D={"updated": "2026-10-15 19:38 UTC", "equity": 99466.68, "cash": 31181.42, "buying_power": 298102.96, "day_pl": 432.27999999999884, "day_pct": 0.43649479372823874, "peak": 100000.0, "paused": false, "dd_limit": 5.0, "positions": [{"symbol": "CSCO", "qty": 112.0, "entry": 109.73, "price": 109.4, "pl": -36.96, "plpc": -0.301, "core": false, "stop": 105.3, "target": 111.97}, {"symbol": "J", "qty": 99.0, "entry": 140.94, "price": 141.2, "pl": 25.74, "plpc": 0.184, "core": false, "stop": 135.9, "target": 143.48}, {"symbol": "LYV", "qty": 88.0, "entry": 172.42, "price": 172.915, "pl": 43.56, "plpc": 0.28700000000000003, "core": false, "stop": 166.82, "target": 175.3}, {"symbol": "SPY", "qty": 18.0, "entry": 769.98, "price": 772.32, "pl": 42.12, "plpc": 0.304, "core": true, "stop": 708.31}, {"symbol": "TRGP", "qty": 46.0, "entry": 281.44, "price": 281.2, "pl": -11.04, "plpc": -0.08499999999999999, "core": false, "stop": 270.62, "target": 286.88}], "pending": [{"symbol": "AME", "qty": "72", "limit": 247.52, "stop": 240.64, "target": 250.99}], "history": [{"d": "2026-10-09", "e": 100000.0, "spy": 100000.0}, {"d": "2026-10-10", "e": 100000.0, "spy": null}, {"d": "2026-10-13", "e": 100070.97, "spy": 99928.07}, {"d": "2026-10-14", "e": 100142.03, "spy": 98847.88}, {"d": "2026-10-15", "e": 99034.4, "spy": 99197.25}]};
const $=id=>document.getElementById(id);
const f=(x,d=2)=>x.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const sg=(x,d=2)=>(x>0?'+':x<0?'−':'')+f(Math.abs(x),d);
const cl=x=>x>0?'good':x<0?'bad':'';
const B=t=>`<bdi>${t}</bdi>`;
const TARGET=350, MAXPOS=18;
const hist=D.history.filter(p=>p.e);
const start=hist.length?hist[0].e:D.equity;
const core=D.positions.filter(p=>p.core), bot=D.positions.filter(p=>!p.core);
const corePl=core.reduce((a,p)=>a+p.pl,0);
const botDay=D.day_pl-corePl;

$('stamp').textContent='עודכן '+D.updated.replace(' UTC','Z');
$('st').className='st'+(D.paused?' off':'');
const [w,fr]=f(D.equity).split('.');
$('eq').innerHTML=`<sup>$</sup>${w}<small>.${fr}</small>`;
const tot=D.equity-start, totp=start?tot/start*100:0;
$('delta').innerHTML=`<span class="dl ${cl(D.day_pl)}">${B(sg(D.day_pl)+'$')} <span class="sub">היום ${B(sg(D.day_pct)+'%')}</span></span>`+
 `<span class="sub">מההתחלה ${B('<span class="'+cl(tot)+'">'+sg(tot,0)+'$ · '+sg(totp)+'%</span>')}</span>`+
 (D.paused?'<span class="bad">הבוט מושהה</span>':'');

// cycle bar
const pct=Math.max(0,Math.min(100,botDay/TARGET*100));
$('cyc').innerHTML=`<div class="t"><b>מחזור יומי של הבוט</b><span>${B('<span class="'+cl(botDay)+'">'+sg(botDay)+'$</span> מתוך '+TARGET+'$')}</span></div>
 <div class="bar"><div class="f ${botDay<0?'neg':''}" style="--w:${botDay<0?Math.min(100,-botDay/TARGET*100):pct}%"></div></div>
 <div class="scale"><span>0</span><span>${TARGET/2}</span><span>${TARGET}$</span></div>
 <div class="sub" style="margin-top:8px">${botDay>=TARGET?'היעד הושג. הבוט סוגר ופותח סיבוב חדש.':'ברגע שהבוט מגיע ליעד הוא סוגר את הפוזיציות שלו ופותח סיבוב חדש. ליבת SPY לא נספרת.'}</div>`;

// ladders
function ladder(p){
  const hasT=!!p.target, hasS=!!p.stop;
  const vals=[p.price,p.entry].concat(hasT?[p.target]:[],hasS?[p.stop]:[]);
  let lo=Math.min(...vals),hi=Math.max(...vals);
  const pad=(hi-lo||1)*.12;lo-=pad;hi+=pad;
  const H=170, y=v=>(1-(v-lo)/(hi-lo))*H;
  const lv=(v,c,lab)=>`<div class="lv ${c}" style="top:${y(v)}px"><b>${f(v)}</b><s></s></div>`;
  let z='';
  if(hasS)z+=`<div class="zb" style="top:${y(p.entry)}px;height:${Math.max(0,y(p.stop)-y(p.entry))}px"></div>`;
  if(hasT)z+=`<div class="zg" style="top:${y(p.target)}px;height:${Math.max(0,y(p.entry)-y(p.target))}px"></div>`;
  else z+=`<div class="zg" style="top:0;height:${y(p.entry)}px"></div><div class="open"></div>`;
  return `<div class="lad"><div class="sy"><span>${p.symbol}</span>${p.core?'<em>ליבה</em>':''}</div>
  <div class="qt">${B(p.qty+' × '+f(p.entry))}</div>
  <div class="tr"><div class="ax"></div>${z}
   ${hasT?lv(p.target,'t'):''}${lv(p.entry,'e')}${hasS?lv(p.stop,'s'):''}
   <div class="nw" style="top:${y(p.price)}px"><span>${f(p.price)}</span></div></div>
  <div class="pl ${cl(p.pl)}">${sg(p.pl)}$<small>${sg(p.plpc,1)}%</small></div></div>`}
$('ph').textContent=D.positions.length?D.positions.length+' פתוחות':'';
$('rack').innerHTML=D.positions.length?D.positions.slice().sort((a,b)=>b.pl-a.pl).map(ladder).join(''):'<div class="empty">אין פוזיציות פתוחות. ההוראות הממתינות למטה מחכות למילוי.</div>';

// exposure
const val=a=>a.reduce((s,p)=>s+p.qty*p.price,0);
const vb=val(bot), vc=val(core), cash=D.cash, tt=vb+vc+cash||1;
const seg=(c,v,l)=>v/tt>0.004?`<div class="${c}" style="width:${v/tt*100}%">${v/tt>0.09?B(f(v/tt*100,0)+'%'):''}</div>`:'';
$('stack').innerHTML=seg('s1',vb,'')+seg('s2',vc,'')+seg('s3',cash,'');
$('keys').innerHTML=`<span><i style="background:var(--sig)"></i>פוזיציות הבוט ${B('$'+f(vb,0))}</span><span><i style="background:var(--spy)"></i>ליבת SPY ${B('$'+f(vc,0))}</span><span><i></i>מזומן ${B('$'+f(cash,0))}</span>`;
$('posn').innerHTML=B(D.positions.length+' / '+MAXPOS);
const unreal=D.positions.reduce((a,p)=>a+p.pl,0), pend=D.pending.reduce((a,o)=>a+(+o.qty)*o.limit,0);
$('kv').innerHTML=[['רווח לא ממומש',`<span class="${cl(unreal)}">${sg(unreal)}$</span>`],['ממתין לביצוע','$'+f(pend,0)],['כוח קנייה','$'+f(D.buying_power,0)],['שיא החשבון','$'+f(D.peak,0)]]
 .map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join('');
const dd=D.peak?Math.max(0,(D.peak-D.equity)/D.peak*100):0, lim=D.dd_limit||5;
$('dd').innerHTML=`<div class="t"><span>ירידה מהשיא</span><span>${B(f(dd,2)+'% מתוך '+f(lim,0)+'% עד עצירה אוטומטית')}</span></div>
 <div class="bar"><div class="f ${dd/lim>.6?'neg':''}" style="--w:${Math.min(100,dd/lim*100)}%"></div></div>`;

// chart
(function(){
 $('since').textContent=hist.length?'מ־'+hist[0].d.slice(5).split('-').reverse().join('.'):'';
 if(hist.length<2){$('chart').innerHTML='<div class="empty">צריך לפחות שני ימי מסחר לעקומה.</div>';return}
 const W=560,H=210,L=8,R=58,T=14,Bt=26,n=hist.length;
 const vs=hist.flatMap(p=>[p.e,p.spy].filter(v=>v!=null));
 let lo=Math.min(...vs),hi=Math.max(...vs);const pad=(hi-lo||200)*.25;lo-=pad;hi+=pad;
 const x=i=>L+(W-L-R)*i/(n-1), y=v=>T+(H-T-Bt)*(1-(v-lo)/(hi-lo));
 const path=k=>hist.map((p,i)=>p[k]==null?null:[x(i),y(p[k])]).filter(Boolean).map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
 let g='';for(let t=0;t<=3;t++){const v=lo+(hi-lo)*t/3,yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line2)"/><text x="${W-R+8}" y="${yy+4}" font-size="11" fill="var(--mute)" font-family="JetBrains Mono,monospace">${f(v/1000,1)}k</text>`}
 const lastE=hist[n-1], ex=x(n-1), ey=y(lastE.e);
 const xl=hist.map((p,i)=>(i==0||i==n-1)?`<text x="${x(i)}" y="${H-6}" font-size="11" fill="var(--mute)" text-anchor="${i?'end':'start'}" font-family="JetBrains Mono,monospace">${p.d.slice(5).split('-').reverse().join('.')}</text>`:'').join('');
 const base=y(start);
 $('chart').innerHTML=`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="עקומת שווי הבוט מול SPY">${g}${xl}
  <line x1="${L}" x2="${W-R}" y1="${base}" y2="${base}" stroke="var(--ink)" stroke-width="1" stroke-dasharray="1 5" opacity=".6"/>
  <path d="${path('spy')}" fill="none" stroke="var(--spy)" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="${path('e')}" fill="none" stroke="var(--sig)" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="${ex}" cy="${ey}" r="6" fill="var(--sig)" stroke="var(--bg)" stroke-width="2.5"/>
  <text x="${ex-10}" y="${ey+22}" text-anchor="end" font-size="12" fill="var(--ink)" font-family="JetBrains Mono,monospace">${f(lastE.e,0)}$</text></svg>`;
})();

// pending
$('oh').textContent=D.pending.length?D.pending.length+' ממתינות':'';
$('ord').innerHTML=D.pending.length?D.pending.map(o=>`<div class="pd"><div><b>${o.symbol}</b><div class="a">${B(o.qty+' מניות')} · קנייה בלימיט</div></div>

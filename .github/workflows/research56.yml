name: Research 5/6 (manual)

on:
  workflow_dispatch:
    inputs:
      script:
        description: "research5 / research6"
        default: "research5"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RR_OVERRIDE: "1.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python ${{ github.event.inputs.script }}.py
      - name: Save report
        if: always()
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add ${{ github.event.inputs.script }}_report.txt
          for i in 1 2 3 4; do git diff --cached --quiet || (git commit -m "research report" -q && git pull --rebase -q && git push -q) && break; sleep $((RANDOM % 8 + 2)); done

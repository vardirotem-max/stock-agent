name: Core SPY sleeve (manual)

on:
  workflow_dispatch:
    inputs:
      dry:
        description: "1 = בדיקה בלי לסגור"
        default: "0"

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      DRY: ${{ github.event.inputs.dry }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python core_sleeve.py | tee core_sleeve_report.txt
      - name: Save
        if: always()
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add core_sleeve_report.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "core sleeve" && git pull --rebase -q && git push)

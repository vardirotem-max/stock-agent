name: Open positions now (manual)

on:
  schedule:
    - cron: "50 13 21 10 *"
    - cron: "5 14 21 10 *"
  workflow_dispatch:
    inputs:
      dry:
        description: "1 = בדיקה בלי לשלוח הוראות"
        default: "1"
      count:
        description: "כמה פוזיציות חדשות"
        default: "4"
      exclude:
        description: "טיקרים להחריג (מופרדים בפסיק)"
        default: ""

permissions:
  contents: write

jobs:
  open:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      DRY: ${{ github.event.inputs.dry || '0' }}
      N_NEW: ${{ github.event.inputs.count || '16' }}
      EXCLUDE: ${{ github.event.inputs.exclude }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python open_now.py
      - name: Save
        if: always()
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          for f in open_now_report.txt signals_log.csv shadow_log.csv; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || (git commit -m "open now" && git pull --rebase -q && git push)

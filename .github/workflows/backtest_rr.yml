name: Backtest RR comparison (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rr: ["0.5", "1.0", "1.5"]
    env:
      RR_OVERRIDE: ${{ matrix.rr }}
      BT_OUT: backtest_rr${{ matrix.rr }}_report.txt
      BT_TRADES: /tmp/trades_rr${{ matrix.rr }}.csv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python backtest.py
      - name: Save report
        if: always()
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add backtest_rr${{ matrix.rr }}_report.txt
          for i in 1 2 3 4; do git diff --cached --quiet || (git commit -m "backtest rr ${{ matrix.rr }}" -q && git pull --rebase -q && git push -q) && break; sleep $((RANDOM % 8 + 2)); done

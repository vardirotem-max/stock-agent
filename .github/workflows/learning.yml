name: Learning report

on:
  workflow_dispatch:
    inputs:
      send:
        description: "1 = לשלוח לטלגרם"
        default: "0"
  schedule:
    - cron: "40 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: learning
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONWARNINGS: ignore
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      SEND: ${{ github.event.inputs.send }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python shadow_eval.py > /tmp/learn.out 2>&1 || true; cat /tmp/learn.out | grep -v "Warning\|inplace"
      - name: Save
        if: always()
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add learning_report.txt shadow_log.csv 2>/dev/null || true
          for i in 1 2 3 4; do git diff --cached --quiet || (git commit -m "learning report" -q && git pull --rebase -q && git push -q) && break; sleep 3; done

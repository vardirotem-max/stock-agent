name: Momentum sleeve

on:
  workflow_dispatch:
    inputs:
      dry:
        description: "1 = בדיקה בלי לסחור"
        default: "0"
      force:
        description: "1 = להתעלם ממרווח האיזון"
        default: "0"

permissions:
  contents: write

concurrency:
  group: momentum-sleeve
  cancel-in-progress: false

jobs:
  sleeve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      DRY: ${{ github.event.inputs.dry }}
      FORCE: ${{ github.event.inputs.force }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          python momentum_sleeve.py > momentum_sleeve_report.txt 2>&1 || echo "EXIT CODE $?" >> momentum_sleeve_report.txt
          cat momentum_sleeve_report.txt
      - name: Save
        if: always()
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add -f momentum_sleeve_report.txt
          [ -f momentum_sleeve.json ] && git add momentum_sleeve.json || true
          for i in 1 2 3 4; do git diff --cached --quiet || (git commit -m "momentum sleeve" -q && git pull --rebase -q && git push -q) && break; sleep 3; done

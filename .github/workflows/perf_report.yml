name: Performance report

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      send:
        description: "1 = לשלוח גם לטלגרם"
        default: "0"

permissions:
  contents: write

jobs:
  perf:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      SEND: ${{ github.event_name == 'schedule' && '1' || github.event.inputs.send }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python reconcile_log.py
      - run: python perf_report.py
      - name: Save
        if: always()
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add signals_log.csv perf_report.txt trades_closed.json
          git diff --cached --quiet || (git commit -m "perf report" && git pull --rebase -q && git push)
